plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "com.gradleup.shadow" version "9.4.1" apply false
    id "dev.architectury.loom-no-remap" version "1.14-SNAPSHOT" apply false
    id "io.github.CDAGaming.cursegradle" version "1.6.1" apply false
    id "com.modrinth.minotaur" version "2.+" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    apply plugin: "java"
    apply plugin: "idea"
    apply plugin: "eclipse"
    apply plugin: "architectury-plugin"

    base {
        archivesName = project.archives_name
    }

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    group = rootProject.maven_group
    version = rootProject.mod_version
}

def platforms = enabled_platforms.split(",")*.trim()

if (platforms.contains("fabric")) {
    tasks.register("curseforgeModrinthFabric") {
        group = "publishing"
        dependsOn ":fabric:modrinth"
        dependsOn ":fabric:curseforge"
    }
}

if (platforms.contains("neoforge")) {
    tasks.register("curseforgeModrinthNeoForge") {
        group = "publishing"
        dependsOn ":neoforge:modrinth"
        dependsOn ":neoforge:curseforge"
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "com.gradleup.shadow"
    apply plugin: "com.matthewprenger.cursegradle"
    apply plugin: "com.modrinth.minotaur"

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = "CurseMaven"
            url = "https://www.cursemaven.com/"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            name = "Modrinth Maven"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {

        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }
}
