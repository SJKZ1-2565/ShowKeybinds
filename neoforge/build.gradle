plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modApi "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

List<String> devExcludes = ["**/gametest/", "**/datagen/", "data/forge/**", "*.snbt", "architectury.common.json"]

String fileName = "Show Keybinds-${project.version}-neoforge"

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev"
    archiveVersion = "v${mod_version}"
    archiveBaseName = fileName
    excludes = devExcludes
}

sourcesJar {
    Jar commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    excludes = devExcludes
}

curseforge {
    apiKey = project.hasProperty("curseForgeApiKey") ? curseForgeApiKey : ""
    project {
        id = "684957"
        changelog = rootProject.file("CHANGE_LOG.md").text
        changelogType = "markdown"
        releaseType = "release"
        addGameVersion "NeoForge"
        addGameVersion minecraft_version
        addGameVersion "Java 21"
        mainArtifact remapJar.archiveFile
        afterEvaluate {
            uploadTask.dependsOn(remapJar)
        }
    }
    options {
        forgeGradleIntegration = false
    }
}

modrinth {
    token = project.hasProperty("modrinthApiKey") ? modrinthApiKey : ""
    projectId = "zaElPFa3"
    versionName = "Show Keybinds ${rootProject.mod_version} ${minecraft_version} NeoForge"
    versionNumber = rootProject.minecraft_version + "-" + rootProject.mod_version + "-neoforge"
    uploadFile = remapJar
    changelog = rootProject.file("CHANGE_LOG.md").text
    gameVersions = ["${minecraft_version}"]
    loaders = ["neoforge"]
    dependencies {
        optional.version "cloth-config", "15.0.140+neoforge"
        required.version "architectury-api", "13.0.8+neoforge"
    }
}
